name: poll
on:
  schedule:
    - cron: "7,22,37,52 * * * *"  # UTC, off the busy :00 mark; GitHub runs schedules best-effort
  workflow_dispatch:
    inputs:
      force:
        description: "Run every source now"
        type: boolean
        default: true
      test_alert:
        description: "Only send one Discord test message"
        type: boolean
        default: false

permissions:
  contents: write                 # lets the run commit calendar.ics when it changes
  actions: read                   # lets the run count its own recent runs (Sources tab)

concurrency:
  group: dashboard-write          # shared with daily.yml so two runs never overwrite each other
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-24.04   # pinned in v3.64; ubuntu-latest becomes Ubuntu 26 on Oct 19, 2026
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install headless Chromium (reads GameStop / Nintendo after their scripts load)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_alert) }}
        run: python -m playwright install --with-deps chromium
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert }}
        run: python -m poller.main --test-alert
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      - if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_alert) }}
        run: python -m poller.main
        env:
          GITHUB_TOKEN: ${{ github.token }}   # read-only use: counts this workflow's recent runs
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
          BESTBUY_KEY: ${{ secrets.BESTBUY_KEY }}
          TARGET_REDSKY_KEY: ${{ secrets.TARGET_REDSKY_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          POKEMONTCG_KEY: ${{ secrets.POKEMONTCG_KEY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      - name: Commit calendar.ics if it changed
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_alert) }}
        run: |
          if [ -f calendar.ics ]; then
            git config user.name "trx-bot"
            git config user.email "actions@users.noreply.github.com"
            git add calendar.ics
            git diff --cached --quiet || (git commit -m "calendar update" && git pull --rebase --quiet && git push)
          fi
