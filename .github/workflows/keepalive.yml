name: keepalive
# GitHub turns off scheduled workflows in public repos after 60 days without commits.
# This commits a one-line timestamp on the 1st of each month so the schedules stay on.
on:
  schedule:
    - cron: "17 16 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-24.04   # pinned in v3.64; ubuntu-latest becomes Ubuntu 26 on Oct 19, 2026
    steps:
      - uses: actions/checkout@v6
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "trx-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" || echo "nothing to commit"
          git push
