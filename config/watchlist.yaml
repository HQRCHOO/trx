notify:                            # Slack pings on stock changes (SLACK_WEBHOOK secret)
  slack: true
  mention_on_first_hand: "<!here>"  # prefix for confirmed first-hand in-stock / preorder pings; "" for none
  sold_out_messages: true           # a quiet message when something goes back to sold out

