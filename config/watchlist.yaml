# TRX watchlist: the only file you edit day to day.
# Values in <angle brackets> are placeholders. Keys and tokens never go here;
# they are GitHub secrets (guide §1).

dashboard_url: https://claude.ai/artifact/V815VkYyqmhDTXXipuvqkV
github_user: "HQRCHOO"   # builds the phone-calendar link to calendar.ics in this repo

location:
  home:                     # all distances and "nearby" are measured from here
    name: Target #912 Chino Hills Grand Avenue
    address: 3944 Grand Ave, Chino, CA 91710
    lat: 34.0016935
    lng: -117.7187131
  radius_miles: 10          # per ZIP; estimate, tune after week one
  areas:
    - {name: SGV,          zip: "91776"}
    - {name: Chino,        zip: "91710"}
    - {name: Chino Hills,  zip: "91709"}
    - {name: Diamond Bar,  zip: "91765"}

pogo:
  event_types: [season, event, community-day, research, go-pass, pokemon-go-tour, raid-day, wild-area, max-battles, elite-raids, raid-weekend, go-rocket-takeover]
  ending_soon_hours: 48

stock:                             # v3.60: GO Plus+ watched at the Nintendo Store only; uncomment a store to turn it back on
  # - name: GO Plus+ (Best Buy)
  #   item: Pokémon GO Plus +
  #   retailer: bestbuy
  #   sku: "6537404"                 # Pokémon GO Plus + (model PMCAWNSAA)
  # - name: GO Plus+ (Target)
  #   item: Pokémon GO Plus +
  #   retailer: target
  #   tcin: "88714054"               # target.com/p/pokemon-go-plus/-/A-88714054
  # - name: GO Plus+ (Walmart)          # counts only when sold by Walmart, not marketplace sellers
  #   item: Pokémon GO Plus +
  #   retailer: walmart
