  #   url: https://www.gamestop.com/gaming-accessories/accessory-kits/nintendo-switch/products/pokemon-go-plus-plus/451400.html   # SKU 451400

target:
  redsky_url: ""                   # off for now: Target refuses GitHub's servers (HTTP 435). To turn on, paste:
  # redsky_url: "https://redsky.target.com/redsky_aggregations/v1/web/product_fulfillment_v1?key={key}&is_bot=false&tcin={tcin}&store_id={store_id}&zip={zip}&state=CA&required_store_id={store_id}&has_required_store_id=true&scheduled_delivery_store_id={store_id}"
  stores:                          # one Target store per area (IDs from target.com/sl/<city>/<id>)
    - {area: SGV,         store_id: "184",  name: "Alhambra"}
    - {area: SGV,         store_id: "1411", name: "Rosemead"}           # store number from 3 listings; confirm
    - {area: Chino,       store_id: "912",  name: "Chino Hills Grand Avenue"}
    - {area: Chino Hills, store_id: "912",  name: "Chino Hills Grand Avenue"}
    - {area: Diamond Bar, store_id: "2179", name: "Diamond Bar"}

card_games:
  alert_days_before: 7
  pokemon:                         # merged with pokemontcg.io / TCGdex set data (poller source pokemonsets)
    - {id: delta-reign, name: "Mega Evolution: Delta Reign", date: "2026-11-06"}
    - {id: ascended-heroes, name: "Mega Evolution: Ascended Heroes", date: "2026-01-30"}     # released; tracked for restocks
    - {id: 30th-celebration, name: "30th Celebration (Wave 1)", date: "2026-09-16"}
    - {id: 30th-celebration-wave-2, name: "30th Celebration (Wave 2)", date: "2026-10-02", confirmed: false, category: other}
    - {id: 30th-celebration-upc, name: "30th Celebration Ultra-Premium Collections (Wave 3)", date: "2026-11-06", confirmed: false, category: other}
  onepiece:
    manual:                        # used when the official page can't be read; also adds unlisted sets
      - {id: eb05, name: "Extra Booster Heroines Edition vol.2 [EB-05]", category: BOOSTER PACK, release_date: "2026-10-30", msrp: "$4.99"}
      - {id: op18, name: "OP-18 The Dominance of God", category: BOOSTER PACK, release_date: "2026-11-20", msrp: "$4.99", note: "Release date from the official products page"}
      - {id: st37-st38, name: "Starter Decks ST-37 / ST-38", category: DECKS, release_date: "2026-12", confirmed: false}
  dragonball:
    manual:
      - {id: fb11, format: Fusion World, name: "Brightness of Hope [FB11]", category: BOOSTER PACK, release_date: "2026-10-16", msrp: "$4.99"}
      - {id: fb12, format: Fusion World, name: "Reach the God [FB12]", category: BOOSTER PACK, release_date: null, note: "Japan Dec 12, 2026; English date not announced"}
      - {id: dbs-b31, format: Masters, name: "Ultra-Bout Series 04 Impact Beyond Dimensions [DBS-B31]", category: BOOSTER PACK, release_date: "2026-07-03", msrp: "$5.99"}
  gundam:
    source: gcg-api

discord_feeds:                     # channels in YOUR server (guide §11); leave the ids as-is until set up
  - {name: iPogo announcements, channel_id: "<channel id>", tab: ipogo}
  - {name: Restock group, channel_id: "<channel id>", tab: stock, keywords: [preorder, restock, live, "GO Plus"]}

calendar:                          # calendar.ics in this repo; subscribe once from your phone
  event_types: [season, event, community-day, raid-day, research, go-pass, pokemon-go-tour, wild-area, max-battles, elite-raids, raid-weekend, go-rocket-takeover]
  card_releases: true

digest:
  hour_pt: 7
  stale_hours: 6

bestbuy:
  zips:                            # Best Buy store checks run around each Target (6 mi); replaces area ZIPs
    - {area: Chino,       zip: "91710", radius_miles: 6}   # home Target #912
    - {area: Diamond Bar, zip: "91765", radius_miles: 6}   # Target #2179
    - {area: SGV,         zip: "91801", radius_miles: 6}   # Target #184 Alhambra
    - {area: SGV,         zip: "91770", radius_miles: 6}   # Target #1411 Rosemead

bestbuy_button:
